<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보험 상담 신청</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1E42">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0B1E42;--ink:#16181C;--ink2:#4F5661;--ink3:#8D949D;--line:#E4E7EB;--bg:#F5F6F8;--ok:#1E9E5A;--err:#C4472F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.hide{display:none!important}
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:20px}
.hero .org{font-size:12.5px;color:#AFC0D8;font-weight:600}
.insname{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:999px;background:#fff;color:var(--navy);font-size:13px;font-weight:800}
.hero h1{margin:6px 0 4px;font-size:22px;letter-spacing:-.4px}
.hero p{margin:0;font-size:14px;color:#D5DEEA}
.card{background:#fff;border-radius:18px;padding:18px;margin-top:12px}
.lb{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 6px}
.f{margin-bottom:14px}
.inp{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;outline:none;font-size:17px}
.inp:focus{border-color:var(--navy)}
.inp.bad{border-color:var(--err);background:#FFF6F4}
.prods{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.prod{height:48px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;font-size:15px;background:#fff}
.prod.on{border-color:var(--navy);background:var(--navy);color:#fff}
.ag{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:14px;margin-top:14px;cursor:pointer}
.ag input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--navy)}
.ag b{font-size:14.5px}
.ag b em{font-style:normal;color:var(--err);margin-right:4px}
.more{font-size:12.5px;color:var(--ink3);text-decoration:underline;margin-left:4px}
.terms{font-size:12.5px;color:var(--ink2);background:var(--bg);border-radius:12px;padding:11px 13px;margin-top:8px;line-height:1.65}
.go{display:flex;align-items:center;justify-content:center;width:100%;height:56px;margin-top:14px;border-radius:16px;background:var(--navy);color:#fff;font-size:17px;font-weight:800;text-decoration:none}
.go:disabled{background:#C9CED6}
.go.sec{background:#EEF2F8;color:var(--navy);height:50px;font-size:15.5px}
.err{margin:10px 0 0;color:var(--err);font-weight:700;font-size:13.5px;min-height:0}
.msg{margin:8px 0 0;font-size:13.5px;color:var(--ink2)}
.ok{width:58px;height:58px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center}
.done h2{margin:10px 0 4px;font-size:20px}
.done p{margin:0;font-size:14.5px;color:var(--ink2)}
.ins{display:flex;align-items:center;justify-content:center;width:100%;height:54px;margin-top:10px;border-radius:14px;color:#fff;font-weight:800;font-size:16px;text-decoration:none}
.ins.mz{background:#E1242A}.ins.kb{background:#FFB81C;color:#3B2A00}.ins.mi{background:#F58220}
.note{margin-top:12px;font-size:12.5px;color:var(--ink2);background:#F1F4F9;border-radius:12px;padding:11px 13px}
.foot{margin-top:14px;font-size:11.5px;color:var(--ink3);line-height:1.7}
.inp:focus-visible,.go:focus-visible,.prod:focus-visible{outline:3px solid #2F6FEB;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="org" id="org">불러오는 중…</div>
    <div class="insname" id="insName" hidden></div>
    <h1>보험 상담 신청</h1>
    <p id="who">궁금한 보험을 고르고 신청하시면 담당 설계사가 연락드립니다.</p>
  </section>

  <section class="card" id="bad" hidden>
    <p class="err" id="badMsg" style="margin:0"></p>
  </section>

  <section class="card" id="formCard" hidden>
    <div class="f"><label class="lb" for="nm">이름</label><input class="inp" id="nm" autocomplete="name" maxlength="20"></div>
    <div class="f"><label class="lb" for="ph">휴대폰번호</label><input class="inp" id="ph" type="tel" inputmode="numeric" maxlength="13" placeholder="010-0000-0000" autocomplete="tel"></div>
    <span class="lb">상담받을 상품 <span style="font-weight:500;color:var(--ink3)">(여러 개 선택 가능)</span></span>
    <div class="prods" id="prods"></div>
    <label class="ag"><input type="checkbox" id="agree"><span><b><em>필수</em>개인정보 수집·이용 동의</b><button type="button" class="more" id="moreBtn">자세히</button></span></label>
    <div class="terms hide" id="terms"></div>
    <p class="err" id="err1"></p>
    <button type="button" class="go" id="apply">신청하기</button>
  </section>

  <section class="card done" id="doneCard" hidden>
    <div class="ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="doneH">신청이 저장되었습니다</h2>
    <p id="doneTxt"></p>
    <div id="insBox" hidden>
      <p class="msg" style="margin-top:16px;font-weight:700;color:var(--ink)" id="goMsg">보험사 공식 인증 화면으로 이동합니다. 자동으로 넘어가지 않으면 아래 버튼을 눌러 주세요.</p>
      <div id="ins"></div>
      <div class="note">주민등록번호와 인증번호는 보험사 공식 화면에만 입력하세요. 이 화면이나 설계사에게 알려주지 않으셔도 됩니다.</div>
    </div>
  </section>

  <p class="foot" id="foot">이 신청은 상담 요청이며 보험 계약(청약)이 아닙니다. 주민등록번호는 받지 않습니다.</p>
</div>
<script>
(function(){
  var API='https://lobdowpxujgiadrtxklb.supabase.co/functions/v1/apply';
  var $=function(i){return document.getElementById(i);};
  var Q=new URLSearchParams(location.search), A=(Q.get('a')||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12), I=/^(mz|kb|mi)$/.test(Q.get('i')||'')?Q.get('i'):'';
  var ADV={name:'',org:''}, SEL=[], busy=false;
  var PRODUCTS=['간병인','치매치료','치아','펫','암','건강종합','어린이','운전자','화재','연금'];
  function call(b){ b.a=A; b.i=I; return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){ return r.json().catch(function(){ return {ok:false,error:'잠시 후 다시 시도해 주세요.'}; }); }); }
  function show(id){ ['bad','formCard','doneCard'].forEach(function(x){ $(x).hidden=(x!==id); }); window.scrollTo({top:0}); }
  function bad(m){ $('badMsg').textContent=m; $('org').textContent=''; show('bad'); }
  function phone(){ return $('ph').value.replace(/[^0-9]/g,''); }
  function fmt(n){ return n.length>=8?n.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3'):(n.length>=4?n.replace(/(\d{3})(\d{1,4})/,'$1-$2'):n); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function drawProds(list){ $('prods').innerHTML=list.map(function(p){ return '<button type="button" class="prod" aria-pressed="false" data-p="'+esc(p)+'">'+esc(p)+'</button>'; }).join('');
    $('prods').querySelectorAll('.prod').forEach(function(b){ b.addEventListener('click',function(){ var p=b.dataset.p, i=SEL.indexOf(p); if(i<0) SEL.push(p); else SEL.splice(i,1); b.classList.toggle('on',i<0); b.setAttribute('aria-pressed',i<0?'true':'false'); $('err1').textContent=''; }); }); }
  function terms(){
    var who=(ADV.org?ADV.org+' ':'')+'담당 설계사 '+ADV.name;
    $('terms').innerHTML='<b>처리자</b>: '+esc(who)+'<br><b>수집 항목</b>: 이름, 휴대폰번호, 상담받을 상품<br><b>이용 목적</b>: 보험 상담 신청 접수와 담당 설계사의 상담 연락<br><b>보유 기간</b>: 상담이 끝나거나 동의를 철회할 때까지 (최대 1년)<br><b>위탁</b>: 신청 접수·저장 시스템 운영 — 다온파트너스(보잇)<br>동의하지 않을 수 있으며, 동의하지 않으면 신청할 수 없습니다.';
    $('foot').innerHTML='이 신청은 상담 요청이며 보험 계약(청약)이 아닙니다. 주민등록번호는 받지 않습니다.<br>개인정보 처리자: '+esc(who)+' · 동의 철회·열람·삭제는 담당 설계사에게 요청하실 수 있습니다.<br>운영: 다온파트너스 보잇(BOIT)';
  }
  $('moreBtn').addEventListener('click',function(e){ e.preventDefault(); $('terms').classList.toggle('hide'); });
  $('ph').addEventListener('input',function(){ this.value=fmt(phone().slice(0,11)); this.classList.remove('bad'); });
  $('nm').addEventListener('input',function(){ this.classList.remove('bad'); });
  function fail(el,m,inp){ $(el).textContent=m; if(inp){ inp.classList.add('bad'); inp.focus(); } }
  $('apply').addEventListener('click',function(){
    if(busy) return; var e='err1'; $(e).textContent='';
    var nm=$('nm').value.replace(/\s+/g,' ').trim(), ph=phone();
    if(nm.length<2) return fail(e,'이름을 입력해 주세요',$('nm'));
    if(!/^01\d{8,9}$/.test(ph)) return fail(e,'휴대폰번호를 확인해 주세요',$('ph'));
    if(!SEL.length) return fail(e,'상담받을 상품을 하나 이상 골라 주세요');
    if(!$('agree').checked) return fail(e,'개인정보 수집·이용에 동의해 주세요');
    busy=true; var b=$('apply'), t=b.textContent; b.disabled=true; b.textContent='저장 중…';
    call({act:'submit',name:nm,phone:ph,products:SEL,agree:true}).then(function(r){
      busy=false; b.disabled=false; b.textContent=t;
      if(!r.ok) return fail(e,r.error||'잠시 후 다시 시도해 주세요.');
      $('doneTxt').textContent=nm+'님, '+ADV.name+' 설계사가 곧 연락드립니다.';
      var L=r.links||[]; $('insBox').hidden=!L.length;
      $('ins').innerHTML=L.map(function(x){ return '<a class="ins '+esc(x.k)+'" href="'+esc(x.url)+'" rel="noopener">인증하기</a>'; }).join('');
      show('doneCard');
      if(L.length===1) setTimeout(function(){ location.href=L[0].url; },1500); // 설계사가 고른 보험사 공식 화면으로 바로 이동
    }).catch(function(){ busy=false; b.disabled=false; b.textContent=t; fail(e,'인터넷 연결을 확인하고 다시 눌러 주세요.'); });
  });
  if(!A){ bad('신청 링크가 올바르지 않습니다. 담당 설계사에게 다시 받아 주세요.'); return; }
  call({act:'info'}).then(function(r){
    if(!r.ok) return bad(r.error||'신청 링크가 올바르지 않습니다.');
    ADV={name:r.name||'',org:r.org||''}; if(r.ins){ $('apply').textContent='신청하고 인증하기'; $('insName').textContent=r.ins+' 보장분석 상담'; $('insName').hidden=false; document.title=r.ins+' 보장분석 상담 신청'; }
    $('org').textContent=ADV.org||' '; $('who').textContent='담당 '+ADV.name+' 설계사가 직접 연락드립니다.';
    drawProds(r.products&&r.products.length?r.products:PRODUCTS); terms(); show('formCard');
  }).catch(function(){ bad('연결에 실패했습니다. 잠시 후 다시 열어 주세요.'); });
})();
</script>
</body>
</html>
