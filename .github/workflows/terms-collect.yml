# 보잇 비서 약관 자동 수집 (삼성화재·KB손보 공시실) — server/terms_collect.py
# 매달 2일 새벽 3시(한국시간) 목록 갱신 + 판매중 4종 본문, 매일 새벽 4시 '필요할 때 읽기' 요청분 본문
name: terms-collect
on:
  schedule:
    - cron: "0 18 1 * *"   # 매달 2일 03:00 KST — 목록 + 본문
    - cron: "0 19 * * *"   # 매일 04:00 KST — 본문(요청분 먼저)
  workflow_dispatch:
    inputs:
      mode:
        description: "all / list / list_samsung / list_kb / body"
        default: "all"
concurrency: terms-collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==5.1.0 requests==2.32.3
      - name: 수집
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 18 1 * *" ]; then MODE=all; else MODE=body; fi
          fi
          python server/terms_collect.py "$MODE"
