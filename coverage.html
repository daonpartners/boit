<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>보장분석 리포트 · 보잇 BOIT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#1C1D22; --ink2:#33343C; --muted:#55565F; --line:#D9CFC4;
  --paper:#FFFFFF; --navy:#1F2A44; --blue:#2F4B8A; --warm:#B4472F; --warm2:#8A3A26;
  --sans:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
  --serif:var(--sans);
  --fs:15px;
}
*{box-sizing:border-box}
body{margin:0;background:#E9E4DD;font-family:var(--sans);color:var(--ink)}
button{font-family:inherit}

/* ---------- 앱 화면 ---------- */
.app{display:flex;flex-wrap:wrap;gap:20px;padding:20px;align-items:flex-start;max-width:1400px;margin:0 auto}
.side{word-break:keep-all;flex:1 1 340px;max-width:420px;display:flex;flex-direction:column;gap:16px}
.panel{background:#fff;border-radius:14px;padding:18px 20px;border:1px solid #DDD5CB}
.panel h2{margin:0 0 12px 0;font-size:17px;color:var(--navy)}
.brandbar{display:flex;align-items:center;gap:12px}
.brandbar img{height:46px}
.brandbar div{font-size:13px;color:var(--muted);line-height:1.4}
.brandbar b{display:block;font-size:17px;color:var(--navy)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
label.f input{font:inherit;font-size:15px;color:var(--ink);padding:9px 11px;border:1px solid #CFC6BB;border-radius:8px}
.drop{display:block;border:2px dashed #A99E92;border-radius:12px;padding:22px;text-align:center;font-size:14px;color:var(--ink2);cursor:pointer;background:#FBF8F4;line-height:1.6}
.drop.over{background:#FDF1EC;border-color:var(--warm)}
.drop b{color:var(--warm)}
.btn{min-height:44px;padding:10px 16px;border-radius:10px;border:0;font-size:15px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}
.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn:disabled{opacity:.45;cursor:default}
.list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid #E4DCD2;background:#fff;cursor:pointer;font-size:14px;text-align:left;width:100%}
.item.on{border-color:var(--navy);background:#EEF2FA}
.item small{color:var(--muted)}
.item .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.item .acts{display:flex;gap:4px;flex-shrink:0}
.ibtn{border:1px solid #D9CFC4;background:#fff;border-radius:7px;font-size:12px;font-weight:700;padding:4px 8px;cursor:pointer;color:var(--ink2);font-family:inherit}
.ibtn:hover{border-color:var(--navy);color:var(--navy)}
.ibtn.del:hover{border-color:#B4472F;color:#B4472F}
.listbar{display:flex;justify-content:flex-end;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:#E8E1D8;color:var(--ink2);white-space:nowrap}
.tag.ok{background:#DCEBDD;color:#1F5A2B}.tag.warn{background:#FBE3D9;color:var(--warm2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.scorebox label.f{margin-bottom:4px}
.scorebox label.f input{padding:6px 8px}
.covt{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.covr{display:grid;grid-template-columns:20px minmax(0,1fr) 70px 112px;gap:6px;align-items:center}
.covr input,.covr select{font:inherit;font-size:13px;padding:6px;border:1px solid #CFC6BB;border-radius:6px;min-width:0}
.covr input[type=checkbox]{width:18px;height:18px}
.ins label{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;margin-bottom:8px;color:var(--ink2)}
.ins input{width:18px;height:18px;margin-top:1px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6;margin:8px 0 0 0}
.warnbox{background:#FDF1EC;border:1px solid #EBC9BE;color:var(--warm2);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.main{flex:999 1 820px;min-width:0;display:flex;flex-direction:column;gap:12px;align-items:center}
.status{font-size:14px;color:var(--ink2);min-height:20px}
.empty{background:#fff;border-radius:14px;padding:60px 30px;text-align:center;color:var(--muted);font-size:15px;line-height:1.8;width:100%;max-width:794px}
.pagewrap{overflow-x:auto;max-width:100%}
#pages{display:flex;flex-direction:column;gap:20px}

/* ---------- 리포트 페이지 (A4 794x1123) ---------- */
.page{word-break:keep-all;overflow-wrap:anywhere;width:794px;height:1123px;background:var(--paper);position:relative;overflow:hidden;font-family:var(--sans);color:var(--ink);box-shadow:0 2px 12px rgba(0,0,0,.12);display:flex;flex-direction:column}
.pbody{flex:1;min-height:0;padding:44px 50px 0 50px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.sech{margin-top:6px}
.pfoot{height:46px;margin:0 50px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#6B625A;gap:12px}
.pfoot .l{display:flex;align-items:center;gap:10px}
.pfoot img{height:22px}
/* 지문성향 리포트: 여백을 넓히고 글자를 한 단계 작게 (PC·출력용) */
.page.fp .pbody{padding:60px 70px 0 70px;gap:10px}
.page.fp .pfoot{margin:0 70px}
.page.fp .card{padding:11px 16px;gap:6px}
.page.fp .ctitle{font-size:16px}
.page.fp .h2{font-size:24px}
.page.fp .kicker{font-size:12.5px}
.kicker{font-size:14px;font-weight:700;letter-spacing:.02em}
.h2{margin:0;font-family:var(--sans);font-size:28px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.lead{margin:0;font-size:var(--fs);line-height:1.6;color:var(--ink2)}
.card{background:#fff;border:1px solid #E4DCD2;border-radius:12px;padding:13px 18px;display:flex;flex-direction:column;gap:7px}
.card.tint-w{background:#FDF1EC;border-color:#EBC9BE}
.card.tint-b{background:#EEF2FA;border-color:#C3CDE3}
.ctitle{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;color:var(--navy)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bl{display:flex;flex-direction:column;gap:4px}
.bi{display:flex;gap:9px;font-size:var(--fs);line-height:1.55;letter-spacing:-.005em;color:var(--ink2)}
.bi .m{flex:none;width:6px;height:6px;border-radius:50%;margin-top:.62em;background:#9A8F84}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;padding:4px 10px;border-radius:20px;background:#F1EAE2;color:var(--ink2)}
.small{font-size:13px;color:var(--muted);line-height:1.6}

.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tab{min-height:48px;border-radius:10px;border:1px solid #CFC6BB;background:#fff;font-size:15px;font-weight:700;color:var(--ink2);cursor:pointer;padding:8px}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab small{display:block;font-size:11px;font-weight:500;opacity:.8}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
.mbar{display:none}
@media (max-width:860px){
  .app{padding:10px;gap:12px}
  .side{max-width:none;flex-basis:100%}
  .main{flex-basis:100%;align-items:stretch}
  .pagewrap{overflow:hidden}
  #pages{gap:12px}
  .page{box-shadow:0 1px 6px rgba(0,0,0,.15)}
  .empty{padding:36px 18px}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #DDD5CB;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
  .mbar .btn{flex:1}
  body.hasmbar{padding-bottom:76px}
  .covr{grid-template-columns:20px minmax(0,1fr) 64px 96px}
}
@media print{ .app .side,.status,.mbar{display:none} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="panel">
      <div class="brandbar">
        <div><b>보장분석 리포트</b>보장분석 자료 PDF를 올리면 고객용 리포트 PDF가 만들어집니다</div>
      </div>
      <div class="tabs" style="margin-top:14px;display:none" id="tabs">
        <button class="tab on" data-mode="adult">성인 지문성향</button>
        <button class="tab" data-mode="child">자녀 지문성향</button>
        <button class="tab" data-mode="disease">질병예측</button>
        <button class="tab" data-mode="coverage">보장분석</button>
      </div>
    </div>

    <div class="panel">
      <h2>1. 내 정보 (처음 한 번만 입력)</h2>
      <label class="f">설계사 이름<input id="advName" placeholder="예: 홍길동" autocomplete="name"></label>
      <label class="f">직함<input id="advTitle" placeholder="예: 팀장"></label>
      <label class="f">연락처<input id="advPhone" placeholder="010-0000-0000" inputmode="tel"></label>
      <label class="f">소속 (리포트 표지와 하단에 표시)<input id="advOrg" placeholder="예: OO보험대리점 OO지점"></label>
      <p class="hint">입력한 내용은 이 컴퓨터에만 저장되어 다음에 열 때 그대로 남아 있습니다.</p>
    </div>

    <div class="panel">
      <h2 id="upTitle">2. 결과지 PDF 올리기</h2>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="application/pdf,.pdf" multiple style="display:none"><input type="file" id="rfile" accept="application/pdf,.pdf" style="display:none">
        <span id="dropText">KGATest 성인 결과지 PDF를 <b>여기로 끌어놓거나 클릭</b>하세요<br>여러 명을 한 번에 올려도 됩니다</span>
      </label>
      <button class="btn ghost" id="manualBtn" style="display:none;width:100%;margin-top:10px">PDF 없이 직접 입력해서 만들기</button>
      <div class="list" id="list"></div>
    </div>

    <div class="panel" id="editPanel" style="display:none">
      <h2>3. 내용 확인 · 수정</h2>
      <div id="warns"></div>
      <div id="editBody"></div>
      <p class="hint">오른쪽 리포트 화면의 글자를 직접 클릭해서 고칠 수도 있습니다. 고친 뒤 바로 PDF로 저장하세요.</p>
    </div>

    <div class="panel">
      <h2>4. PDF로 저장</h2>
      <div class="actions">
        <button class="btn primary" id="saveOne" disabled>이 고객 PDF 저장</button>
        <button class="btn ghost" id="saveAll" disabled>전체 PDF 저장</button>
      </div>
      <p class="hint" id="fnHint">파일 이름: 고객명_지문성향리포트_설계사명.pdf</p>
    </div>
  </aside>

  <div class="mbar" id="mbar"><button class="btn ghost" id="mPreview">미리보기로 이동</button><button class="btn primary" id="mSave">이 고객 PDF 저장</button></div>
  <main class="main">
    <div class="status" id="status"></div>
    <div class="empty" id="empty">왼쪽에서 결과지 PDF를 올리면<br>여기에 고객용 리포트가 미리 보입니다.</div>
    <div class="pagewrap"><div id="pages"></div></div>
  </main>
</div>

var workerReady=null;
function ensureWorker(){
  if(workerReady) return workerReady;
  workerReady=fetch(WORKER_URL).then(function(r){return r.text();}).then(function(src){
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
  }).catch(function(){ pdfjsLib.GlobalWorkerOptions.workerSrc=WORKER_URL; });
  return workerReady;
}

function pageLines(tc){
  var items=tc.items.filter(function(i){return i.str&&i.str.trim()!=='';}).map(function(i){return {s:i.str,x:i.transform[4],y:i.transform[5],w:i.width};});
  items.sort(function(a,b){return Math.abs(b.y-a.y)>3?(b.y-a.y):(a.x-b.x);});
  var lines=[],cur=null;
  items.forEach(function(it){
    if(!cur||Math.abs(cur.y-it.y)>3){cur={y:it.y,parts:[it]};lines.push(cur);} else cur.parts.push(it);
  });
  return lines.map(function(l){
    l.parts.sort(function(a,b){return a.x-b.x;});
    var t='';
    l.parts.forEach(function(p,i){ if(i>0){var prev=l.parts[i-1]; if(p.x-(prev.x+prev.w)>2) t+=' ';} t+=p.s; });
    return t.replace(/\s+/g,' ').trim();
  }).filter(function(t){return t && !/www\.kgatest|1544-3105|무단\s*복제|저작권은/.test(t);});
}

var PARTICLE=/^(를|을|이|가|는|은|의|에|도|로|와|과|며|고|서|요|다)(\s|$|[.,])/;
function joinLines(lines){
  var out='';
  lines.forEach(function(l){
    if(!out){out=l;return;}
    if(/[.!?)]$/.test(out)) out+=' '+l;
    else if(PARTICLE.test(l)) out+=l;
    else out+=' '+l;
  });
  return out;
}
function sentences(text){
  return text.split(/(?<=[.!?])\s+(?=\S)/).map(function(s){return s.replace(/^또한\s+/,'').trim();}).filter(Boolean);
}

async function parsePdf(file){
  await ensureWorker();
  var buf=new Uint8Array(await file.arrayBuffer());
  var doc=await pdfjsLib.getDocument({data:buf,cMapUrl:CMAP_URL,cMapPacked:true}).promise;
  var pages=[];
  for(var n=1;n<=doc.numPages;n++){
    var pg=await doc.getPage(n);
    var tc=await pg.getTextContent();
    pages.push({n:n,page:pg,tc:tc,lines:pageLines(tc)});
  }
  var c={fileName:file.name,warns:[],scores:{},sections:{main:{},sub:{}}};
  var all=[];pages.forEach(function(p){all=all.concat(p.lines);});
  var allText=all.join('\n');
  if(!/평가번호|인격적\s*성향/.test(allText)) throw new Error('not kga');
  c.kind=/학습\s*할\s*때\s*특징|다중지능/.test(allText)?'child':'adult';
  var mm=allText.match(/\[[^\]]+\]\s*([가-힣\/]+)\s*지능/);
  if(mm&&MI[mm[1]]) c.mi=mm[1];

  var m;
  if((m=allText.match(/평가번호\s*([A-Z0-9-]+)/))) c.evalNo=m[1];
  if((m=allText.match(/평가일자\s*([\d.\-\/]+)/))) c.evalDate=m[1];
  if((m=allText.match(/이\s*름\s*([가-힣A-Za-z]+)/))) c.name=m[1];
  if((m=allText.match(/([가-힣A-Za-z]+)님은\s*(\d+)번\s*인격유형으로\s*주성향은\s*([가-힣]+?형)이고\s*보조성향은\s*([가-힣]+?형)입니다/))){
    if(!c.name) c.name=m[1]; c.typeNo=m[2]; c.main=m[3]; c.sub=m[4];
  }
  var flat=joinLines(all);
  if((m=flat.match(/님은\s*주\s*성향과\s*보조성향\s*두\s*가지\s*유형으로\s*(.+?유형입니다\.)/))) c.summary=m[1];

  // 성향 블록과 1~9 섹션
  var block=null,sec=null,buckets={main:{},sub:{}};
  for(var i=0;i<all.length;i++){
    var line=all[i];
    if(/비율대조표|다중지능|^\[[^\]]+\]\s*\S+\s*지능$/.test(line)){block=null;sec=null;continue;}
    var tm=line.match(/인격적\s*성향\s*:\s*([가-힣]+형)/);
    if(tm){
      block=!buckets.main.__set?'main':'sub';
      buckets[block].__set=true;
      if(block==='main'&&!c.main) c.main=tm[1];
      if(block==='sub'&&!c.sub) c.sub=tm[1];
      sec=null; continue;
    }
    if(!block) continue;
    var hm=line.match(/^([1-9])\s*\.\s*([가-힣\s]{2,16})$/);
    if(hm){sec=SEC[hm[1]];buckets[block][sec]=[];continue;}
    if(sec) buckets[block][sec].push(line);
  }
  ['main','sub'].forEach(function(b){
    Object.keys(SEC).forEach(function(k){
      var key=SEC[k],ls=buckets[b][key];
      if(!ls||!ls.length){c.warns.push((b==='main'?'주성향':'보조성향')+' "'+key+'" 항목을 찾지 못했습니다.');c.sections[b][key]=[];return;}
      var t=joinLines(ls);
      if(key==='직업') c.sections[b][key]=t.replace(/\s*등\s*$/,'').split(/\s*,\s*/).map(function(s){return s.trim();}).filter(Boolean);
      else c.sections[b][key]=sentences(t);
    });
  });

  // 막대그래프 수치 (그래프 페이지를 그려서 막대 높이를 잼)
  var cp=pages.filter(function(p){return p.lines.some(function(l){return /비율대조표/.test(l);});})[0];
  if(cp){ try{ c.scores=await readBars(cp); }catch(e){ console.error(e); } }
  IND.forEach(function(k){ if(typeof c.scores[k]!=='number') c.warns.push('지표 "'+k+'" 값을 읽지 못했습니다. 직접 입력해 주세요.'); });

  if(!c.name) c.warns.push('고객 이름을 찾지 못했습니다.');
  if(!c.main||!c.sub) c.warns.push('주성향/보조성향을 찾지 못했습니다. 올바른 KGATest 결과지인지 확인해 주세요.');
  c.ins=insuranceRows(c);
  return c;
}

async function readBars(p){
  var items=p.tc.items.filter(function(i){return i.str&&i.str.trim();});
  // 그래프 축 라벨(가장 위쪽에 있는 같은 이름) 위치
  var lab={};
  items.forEach(function(i){
    var s=i.str.trim(); if(IND.indexOf(s)<0) return;
    if(!lab[s]||i.transform[5]>lab[s].y) lab[s]={x:i.transform[4]+i.width/2,y:i.transform[5]};
  });
  var ax0=null,ax100=null;
  items.forEach(function(i){
    var s=i.str.trim();
    if(s==='0'&&(!ax0||i.transform[5]>ax0)) ax0=i.transform[5];
    if(s==='100'&&(!ax100||i.transform[5]>ax100)) ax100=i.transform[5];
  });
  if(ax0===null||ax100===null||ax100<=ax0) throw new Error('axis');
  var scale=2, vp=p.page.getViewport({scale:scale});
  var cv=document.createElement('canvas'); cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height);
  var ctx=cv.getContext('2d',{willReadFrequently:true});
  await p.page.render({canvasContext:ctx,viewport:vp}).promise;
  var H=vp.height/scale; // pdf 높이
  var full=(ax100-ax0); // 0~100 거리 (pdf 단위)
  var out={};
  IND.forEach(function(k){
    var L=lab[k]; if(!L) return;
    var topPdfY=ax100+full*0.15, botPdfY=ax0-2;
    var px=Math.round(L.x*scale);
    var yStart=Math.round((H-topPdfY)*scale), yEnd=Math.round((H-botPdfY)*scale);
    var data=ctx.getImageData(px-3,yStart,7,yEnd-yStart).data;
    var rowW=7, first=-1, last=-1;
    for(var r=0;r<yEnd-yStart;r++){
      var hit=0;
      for(var q=0;q<rowW;q++){
        var o=(r*rowW+q)*4, R=data[o],G=data[o+1],B=data[o+2];
        if((R>90&&G>30&&G<115&&B<70)||(B>90&&G>30&&G<115&&R<70)) hit++;
      }
      if(hit>=4){ if(first<0) first=r; last=r; }
    }
    if(first<0) return;
    var v=Math.round(((last-first+1)/scale)/full*100);
    out[k]=Math.max(0,Math.min(100,v));
  });
  return out;
}

var JOB_KEY={
  '안정형':['공무원','행정','회계','사무','은행','비서','사서','관리'],

/* 내용이 넘치면 다음 장으로 자동으로 넘김 (섹션이 바뀌어도 새 장을 시작하지 않고 이어서 배치) */
function flowPages(host,headFn,blocks,a,fs){
  var made=[], part=0;
  function newPage(cont){
    var pg=document.createElement('div'); pg.className='page'; made.push(pg);
    if(fs) pg.style.setProperty('--fs',fs+'px');
    if(window.PAGE_CLS) pg.classList.add(window.PAGE_CLS);
    pg.innerHTML='<div class="pbody">'+(cont?headFn(true,part):'')+'</div>'+foot(a);
    host.appendChild(pg); return pg.querySelector('.pbody');
  }
  var body=newPage(false),onPage=0;
  function over(){return body.scrollHeight>body.clientHeight+1;}
  blocks.forEach(function(b){
    var h=typeof b==='string'?b:b.html; if(typeof b==='object'&&b.part!=null) part=b.part;
    var tmp=document.createElement('div'); tmp.innerHTML=h; var el=tmp.firstElementChild; if(!el) return;
    if(el.classList.contains('pgbreak')&&onPage>0){ body=newPage(true); onPage=0; }
    body.appendChild(el);
    if(!over()){onPage++;return;}
    var prev=el.previousElementSibling, keep=prev&&prev.classList.contains('keepnext')&&onPage>1;
    // 설명 박스(stick)는 바로 위 카드의 마지막 줄 몇 개와 함께 다음 장으로 넘겨 같은 장에서 끝나게 함
    if(el.classList.contains('stick')&&prev&&onPage>0){
      body.removeChild(el);
      var pl=prev.querySelector(':scope > .bl');
      if(pl&&pl.children.length>4){
        var mv=[]; while(mv.length<3&&pl.children.length>2){ mv.unshift(pl.lastElementChild); pl.removeChild(pl.lastElementChild); }
        var rp=prev.cloneNode(true), rl=rp.querySelector(':scope > .bl'); rl.innerHTML=''; mv.forEach(function(m){rl.appendChild(m);});
        var tt=rp.querySelector('.ctitle'); if(tt&&tt.lastChild&&!/이어서/.test(tt.textContent)) tt.lastChild.textContent=tt.lastChild.textContent+' (이어서)';
        body=newPage(true); body.appendChild(rp); body.appendChild(el); onPage=2; return;
      }
      if(onPage>1){ body.removeChild(prev); body=newPage(true); body.appendChild(prev); body.appendChild(el); onPage=2; return; }
      body=newPage(true); body.appendChild(el); onPage=1; return;
    }
    // 카드 안의 항목을 나눠서 다음 장으로 이어 붙임 (한 장을 넘으면 여러 장으로 계속 나눔)
    var cur=el, first=true;
    while(true){
      var list=cur.querySelector(':scope > .bl'), moved=[];
      if(!(list&&(onPage>0||!first||cur.classList.contains('pgbreak')))) break;
      while(over()&&list.children.length>2){ moved.unshift(list.lastElementChild); list.removeChild(list.lastElementChild); }
      if(!over()&&moved.length){
        var rest=cur.cloneNode(true); var rl=rest.querySelector(':scope > .bl'); rl.innerHTML='';
        rest.classList.remove('pgbreak');
        [].forEach.call(cur.querySelectorAll('.onlylast'),function(x){x.parentNode.removeChild(x);});
        moved.forEach(function(m){rl.appendChild(m);});
        var t=rest.querySelector('.ctitle'); if(t&&t.lastChild&&!/\(이어서\)/.test(t.textContent)) t.lastChild.textContent=t.lastChild.textContent+' (이어서)';
        body=newPage(true); body.appendChild(rest); onPage=1;
        if(!over()) return;
        cur=rest; first=false; continue;
      }
      moved.forEach(function(m){list.appendChild(m);});
      if(!first) return;
      break;
    }
    if(onPage>0){
      body.removeChild(el);
      if(keep){ body.removeChild(prev); body=newPage(false); body.appendChild(prev); body.appendChild(el); onPage=1; return; }
      body=newPage(!el.classList.contains('sech')); body.appendChild(el); onPage=0;
    }
    onPage++;
  });
  return made;
}
/* 여러 섹션을 한 흐름으로: parts=[{head:fn(cont), blocks:fn()}] */
function chainBlocks(parts){
  var out=[];
  parts.forEach(function(p,i){
    var bl=p.blocks(); if(!bl.length) return;
    out.push({part:i,html:'<div class="sech keepnext">'+p.head(false)+'</div>'});
    bl.forEach(function(h){ out.push({part:i,html:h}); });
  });
  return out;
}
function chainFlow(host,parts,a){
  fitFlow(host,function(cont,i){ return '<div style="margin-bottom:-2px">'+parts[i].head(true)+'</div>'; },function(){return chainBlocks(parts);},a);
}

/* 마지막 장이 거의 비면 글자를 조금 줄여서 장수를 줄임 */
function fitFlow(host,headFn,blocksFn,a){
  var hf=headFn.length>=2?headFn:function(cont){return cont?headFn(true):headFn(false);};
  var bf=headFn.length>=2?blocksFn:function(){ return [{part:0,html:'<div class="sech keepnext">'+headFn(false)+'</div>'}].concat(blocksFn()); };
  var F=window.FLOW_FS||15;
  var base=flowPages(host,hf,bf(),a,F);
  if(base.length<2) return;
  var last=base[base.length-1].querySelector('.pbody');
  var used=0; [].forEach.call(last.children,function(ch){used=Math.max(used,ch.offsetTop+ch.offsetHeight);});
  if(used>last.clientHeight*0.45) return;
  var sizes=[F-.5,F-1,F-1.5];
  for(var k=0;k<sizes.length;k++){
    var trial=flowPages(host,hf,bf(),a,sizes[k]);
    if(trial.length<base.length){ base.forEach(function(p){host.removeChild(p);}); return; }
    trial.forEach(function(p){host.removeChild(p);});
  }
}

function rawGrade(v,lo,hi,segTxt){
  var a=Math.min(lo,hi), b=Math.max(lo,hi);
  if(v>=a&&v<=b) return 0;
  var re=/(<|>)?\s*(\d+(?:\.\d+)?)(?:\s*-\s*(\d+(?:\.\d+)?))?\s*\((-|\+{1,3})\)/g, m, g=-1;
  while(segTxt&&(m=re.exec(segTxt))){
    if(m[4]==='-') continue;
    var x=parseFloat(m[2]), y=m[3]!=null?parseFloat(m[3]):null, hit=false;
    if(m[1]==='>') hit=v>x; else if(m[1]==='<') hit=v<x; else if(y!=null) hit=v>=Math.min(x,y)&&v<=Math.max(x,y);
    if(hit){ g=Math.max(g,m[4].length); }
  }
  return g>0?g:1;
}
function rawParseSections(all){
  var secs=[],cur=null;
  all.forEach(function(l){
    var t=l.match(/^\(([^)]+)\)\s*분석 보고서$/);
    if(t){ cur={cat:t[1].trim(),lines:[]}; secs.push(cur); return; }
    if(/^(양자 측정 종합 보고서|전문가 분석 보고서|핸드 분석 보고서)$/.test(l)){ cur=null; return; }
    if(cur) cur.lines.push(l);
  });
  secs.forEach(function(s){
    s.items=[];
    var i0=s.lines.findIndex(function(l){return /^검사측정항목/.test(l);});
    var stdI=s.lines.findIndex(function(l){return /^참고표준/.test(l);});
    var refI=s.lines.findIndex(function(l){return /^참\s*고\s*자\s*료/.test(l);});
    var end=s.lines.findIndex(function(l,i){return i>i0&&/^(정상\(-\)|참고표준|검사측정 참고자료|참\s*고\s*자\s*료)/.test(l);});
    if(i0<0) return;
    s.lines.slice(i0+1,end>0?end:undefined).forEach(function(l){
      var m=l.match(/^(.+?)\s+(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)(?:\s|$)/);
      if(m) s.items.push({name:m[1].trim(),lo:parseFloat(m[2]),hi:parseFloat(m[3]),v:parseFloat(m[4])});
    });
    var std=stdI>=0?s.lines.slice(stdI+1,refI>stdI?refI:undefined).join(' '):'';
    s.items.forEach(function(it,k){
      var p=std.indexOf(it.name+':'); if(p<0) p=std.indexOf(it.name+' :');
      var seg='';
      if(p>=0){ var rest=std.slice(p+it.name.length+1); var nx=s.items.slice(k+1).map(function(o){return rest.indexOf(o.name+':');}).filter(function(x){return x>0;}); seg=nx.length?rest.slice(0,Math.min.apply(null,nx)):rest; }
      it.grade=rawGrade(it.v,it.lo,it.hi,seg);
      it.dir=it.v>Math.max(it.lo,it.hi)?'high':(it.v<Math.min(it.lo,it.hi)?'low':'');
      var w=Math.abs(it.hi-it.lo)||1; it.dev=it.dir==='high'?(it.v-Math.max(it.lo,it.hi))/w:(it.dir==='low'?(Math.min(it.lo,it.hi)-it.v)/w:0);
      it.cat=s.cat;
    });
  });
  return secs;
}
function rawFoundLine(it){
  var a=Math.min(it.lo,it.hi), b=Math.max(it.lo,it.hi);
  var g=it.grade>=3?'보고서 기준 고도 이상 구간':(it.grade===2?'보고서 기준 중도 이상 구간':'보고서 기준 경도 이상 구간');
  return it.name+' '+it.v+'은(는) 보고서 정상범위('+a+'~'+b+')보다 '+(it.dir==='high'?'높게':'낮게')+' 측정되었고, '+g+'입니다.';
}
function parseDiseaseRaw(all,c){
  var text=all.join('\n'), m;
  if((m=text.match(/이름\s*:\s*([가-힣]{2,5})/))) c.name=m[1];
  if((m=text.match(/성별\s*:\s*([남여])/))) c.gender=m[1];

    if(ab.length>4) found.push('이 밖에 '+ab.slice(4).map(function(i){return i.name;}).join(', ')+' 등 '+(ab.length-4)+'개 항목도 보고서 정상범위를 벗어났습니다.');
    if(nor.length) found.push(nor.slice(0,4).map(function(i){return i.name;}).join(', ')+(nor.length>4?' 등 '+nor.length+'개 항목':'')+'은(는) 보고서 정상범위입니다.');
    areas.push({key:A.key,no:0,title:A.title,found:found,easy:[A.easy],manage:A.manage.slice(),checkup:A.checkup.slice(),life:A.life.slice(),ins:A.ins.slice(),
      score:ab.reduce(function(s,i){return s+(i.grade>=3?100:i.grade===2?10:1);},0)+Math.min(ab.reduce(function(s,i){return s+i.dev;},0),9)/10,
      items:ab,g3:ab.filter(function(i){return i.grade>=3;}).length,g2:ab.filter(function(i){return i.grade===2;}).length,g1:ab.filter(function(i){return i.grade===1;}).length,level:ab[0].grade,
short:A.short,top:A.top,topCover:A.topCover,abNames:ab.slice(0,3).map(function(i){return i.name;})});
  });
  areas.sort(function(a,b){return b.score-a.score;});
  // 중도 이상(++) 부위를 위에서부터 최대 5개, 중도 이상이 4개 미만이면 경도 영역으로 4개까지 채움
  var sev=areas.filter(function(x){return x.level>=2;}), pick=sev.slice(0,5);
  if(pick.length<4) pick=pick.concat(areas.filter(function(x){return x.level<2;}).slice(0,4-pick.length));
  areas.forEach(function(x){ x.on=pick.indexOf(x)>=0; });
  c.areas=areas; c.rawPicked=true;
  c.summaryIntro=areas.length?'이번 자료에서 우선 확인해볼 건강영역은 '+areas.map(function(a){return a.short;}).join(', ')+'입니다.':'';
  c.summaryRows=areas.map(function(a){return {area:a.short,text:a.abNames.join(', ')+' 지표가 보고서 정상범위를 벗어남'};});
  c.topIntro='아래 순서는 질병 발생 가능성 순위가 아니라, 이번 검사자료에서 나타난 이상신호(벗어난 정도와 개수)를 기준으로 건강과 보장을 함께 확인해볼 순서입니다.';
  c.top=areas.slice(0,5).map(function(a,i){return {rank:String(i+1),area:a.top,cover:a.topCover};});
  // 건강영역에 넣지 않은 분류는 참고 지표로만 정리
  var OTHER_OK=/비만|미량|비타민|면역|혈액|신체성분/;
  c.others=secs.filter(function(s){return s.items.length&&!used[s.cat]&&OTHER_OK.test(s.cat);}).map(function(s){
    var ab=s.items.filter(function(i){return i.grade>0;}); return {cat:s.cat,n:s.items.length,ab:ab.length,names:ab.slice(0,3).map(function(i){return i.name;})};
  }).filter(function(o){return o.ab>0;});
  c.secs=secs;
  c.rawStats={sections:secs.length,items:secs.reduce(function(s,x){return s+x.items.length;},0)};

var DIS_SUB={'자료에서 확인된 내용':'found','쉽게 설명하면':'easy','예방 차원에서 관리할 질환·영역':'manage','이렇게 건강검진을 준비하세요':'checkup','생활관리는 이렇게 하세요':'life','보험은 이렇게 준비하세요':'ins'};

    var pg=await doc.getPage(n); var tc=await pg.getTextContent();

  }

  if(/분석 보고서/.test(text)&&/검사측정항목/.test(text)){
    parseDiseaseRaw(all,c);
    if(!c.name) c.warns.push('고객 이름을 찾지 못했습니다.');
    if(!c.areas.length) c.warns.push('정상범위를 벗어난 항목을 찾지 못했습니다. 원본 보고서 표 형식을 확인해 주세요.');
    c.warns.push('검사측정 원본에서 자동으로 만든 리포트입니다. 고객에게 드리기 전에 영역별 내용을 한 번 읽어봐 주세요. ('+c.rawStats.sections+'개 분류, '+c.rawStats.items+'개 항목 읽음)');

  if((m=text.match(/신장\s*\/\s*체중\s*([\d.]+\s*cm)\s*\/\s*([\d.]+\s*kg)/))){ c.height=m[1]; c.weight=m[2]; }

  if(ni>=0) c.notice=sentences(joinLines(preamble.slice(ni+1)));

}
function bulletItems(lines){

}
function parseArea(s){
  var a={no:s.no,title:s.title,found:[],easy:[],manage:[],checkup:[],life:[],ins:[]},key=null,buf={};
  s.lines.forEach(function(l){ if(l in DIS_SUB){ key=DIS_SUB[l]; buf[key]=[]; return; } if(key) buf[key].push(l); });
  Object.keys(buf).forEach(function(k){ a[k]=k==='easy'?sentences(joinLines(buf[k])):bulletItems(buf[k]); });
  return a;
}
function parseSummary(s,c,areaTitles){
  var hi=s.lines.findIndex(function(l){return /^관심영역/.test(l);});
  var intro=hi>=0?s.lines.slice(0,hi):s.lines;
  c.summaryIntro=joinLines(intro);
  if(hi<0) return;
  var rows=[],cur=null;
  s.lines.slice(hi+1).forEach(function(l){
    var tok=l.split(' ')[0];
    var isNew=/·/.test(tok)||areaTitles.some(function(t){return t.indexOf(tok)===0;});
    if(isNew){ cur={area:tok,text:l.slice(tok.length).trim()}; rows.push(cur); }
    else if(cur){ cur.text=joinLines([cur.text,l]); }
  });
  c.summaryRows=rows;
}
function parseTop(s,c){
  var hi=s.lines.findIndex(function(l){return /^순서/.test(l);});
  c.topIntro=joinLines(hi>=0?s.lines.slice(0,hi):[]);
  var cur=null;
  (hi>=0?s.lines.slice(hi+1):s.lines).forEach(function(l){
    var r=l.match(/^([1-9])\s+(\S+)\s+(.+)$/);
    if(r){ cur={rank:r[1],area:r[2],cover:r[3]}; c.top.push(cur); }
    else if(cur){ cur.cover+=l.replace(/^\s+/,''); }
  });
}
function parseSteps(s,c){
  var cur=null,imp=-1;
  s.lines.forEach(function(l,i){
    if(imp>=0) return;
    if(/^중요\s*안내$/.test(l)){ imp=i; return; }
    var r=l.match(/^([1-9])\.\s*(.+)$/);
    if(r){ cur=[r[2]]; c.steps.push(cur); }
    else if(cur) cur.push(l);
  });
  c.steps=c.steps.map(function(x){ var t=joinLines(x); var k=t.indexOf('. '); return k>0?{h:t.slice(0,k+1),b:t.slice(k+2)}:{h:t,b:''}; });
  if(imp>=0) c.important=joinLines(s.lines.slice(imp+1));
}

function covClassify(name){
  var n=name.replace(/\s+/g,'').replace(/\(?(유사암|소액암)제외\)?/g,'');
  if(/산정특례/.test(n)) return /뇌/.test(n)?'brain_special':(/심장/.test(n)?'heart_special':'etc');

  if(/치매|알츠하이머|레켐비/.test(n)&&/약물|치료비/.test(n)) return 'dem_drug';
  if(/치매|인지장애/.test(n)) return /중증|중등도/.test(n)?'dementia_severe':'dementia_mild';
  if(/간병/.test(n)) return 'care';
  if(/치매|알츠하이머|레켐비/.test(n)&&/약물|치료비/.test(n)) return 'dem_drug';
  if(/암/.test(n)&&/비급여/.test(n)) return 'cancer_nonpay';
  if(/암/.test(n)&&/(주요치료|통합치료)/.test(n)) return 'cancer_main';
  if(/중입자|양성자|표적|면역항암|카티|CAR-?T|항암/i.test(n)) return 'cancer_named';
  if(/암/.test(n)&&/치료비/.test(n)) return 'cancer_main';
  if(/2대질환|순환계/.test(n)||(/(심혈관|뇌혈관|심장|뇌|허혈)/.test(n)&&/(주요치료|치료비|혈전|중재)/.test(n))) return 'circ_tx';
  if(/암/.test(n)&&/수술/.test(n)) return 'cancer_surg';
  if(/(뇌|심장|심혈관|허혈|관상동맥)/.test(n)&&/수술/.test(n)) return 'cv_surg';
  if(/통합암|암종별/.test(n)) return 'cancer_multi';
  if(/유사암|소액암|갑상선암|제자리암|경계성|기타피부암/.test(n)) return 'cancer_sim';
  if(/특정암/.test(n)) return 'cancer_special';
  if(/고액암|고액치료비암/.test(n)) return 'cancer_high';
  if(/일반암|^암진단/.test(n)||(/암/.test(n)&&/진단/.test(n))) return 'cancer';
  if(/뇌혈관/.test(n)) return 'brain_all';
  if(/뇌졸중|뇌경색/.test(n)) return 'stroke';
  if(/뇌출혈/.test(n)) return 'brain_hem';
  if(/허혈성심|허혈심/.test(n)) return 'ihd';
  if(/급성심근경색/.test(n)) return 'ami';
  if(/(심장|심혈관)/.test(n)&&/진단/.test(n)) return 'heart_other';
  if(/종수술|[1-5]종/.test(n)&&/수술/.test(n)) return /상해/.test(n)?'surg_injn':'surg_n';
  if(/질병수술/.test(n)) return 'surg_dis';
  if(/상해수술/.test(n)) return 'surg_inj';
  if(/골절/.test(n)) return 'fracture';
  if(/입원|일당/.test(n)) return 'hosp';

  if(/사망/.test(n)) return 'death';

  if(/배상|법률|소송|화재벌금/.test(n)) return 'liab';
  if(/벌금|교통사고|변호사|운전자|자동차사고/.test(n)) return 'driver';

/* 상태(충분/부족/미가입)로 끝나는 진단표 한 줄 → 담보, 권장, 가입 */
var COV_PREFIX=['입원비(일당)','법률,배상책임','치아,화상,골절','뇌혈관질환','심장질환','실손의료비','후유장해','수술비','치료비','운전자','사망','치매','암 진단','뇌/심장','의료비','실손','수술','입원','기타','장해','간병'];

/* ---------- 회사별(계약별) 가입 내역: 좌표로 열을 나눠 읽음 (메리츠 별첨 · 신정원 상품별 가입담보상세) ---------- */

function covContracts(pages){

  pages.forEach(function(items){
    var rows=covRowsByY(items), txt=rows.map(function(r){return r.text;}).join('\n');
    var isM=/상품별\s*보험가입현황/.test(txt), isO=/상품별\s*가입담보상세/.test(txt);
    if(!isM&&!isO){ cur=null; return; }
    for(var i=0;i<rows.length;i++){

      if(isO&&(m=t.match(/^(\S.*?)\s*\|\s*가입일자\s*:\s*([\d-]+)/))){

        var r4=(rows[i+1]||{}).text||'';
        if((m=r4.match(/(\d{4}\.\d{2}\.\d{2})\s*~\s*(\d{4}\.\d{2}\.\d{2})/))){ o2.from=m[1]; o2.to=m[2]; }

}
async function parseCoverage(file){

  var pitems=[];

    pitems.push(tc.items.filter(function(it){return it.str&&it.str.trim();}).map(function(it){return {x:it.transform[4],y:it.transform[5],s:it.str};})); }

  if((m=text.match(new RegExp('('+NM+')\\s*(?:\\([^)]*\\)\\s*)?님의\\s*(?:전체\\s*보장현황|상품별)')))||(m=text.match(new RegExp('('+NM+')\\s*고객님')))||(m=text.match(new RegExp('계약자/피보험자\\s*(?:'+NM+'\\s*/\\s*)?('+NM+')')))) c.name=m[1];

  if((m=text.match(/고객님\s*[남여]\s*(\d{1,3})\s*세/))||(m=text.match(/\(\s*(\d{1,3})\s*세\s*,?\s*(?:남자|여자)\s*\)/))||(m=text.match(/(\d{2,3})\s*세/))) c.age=m[1];
  if((m=text.match(/(남자|여자)/))) c.gender=m[1]==='남자'?'남':'여'; else if((m=text.match(/고객님\s*(남|여)\s*\d/))) c.gender=m[1];

/* ---------- 표기 정리: 간병인 합치기 · 치료비 4종 · 개별 항암치료비 제외 ---------- */

    if(mode==='disease'){
      setStatus('자료 읽는 중… ('+(i+1)+'/'+files.length+') '+files[i].name);
      try{ var dc=await parseDisease(files[i]); dc.mode=mode; state.customers.push(dc); last=state.customers.length-1; if(state.current<0||!curC()||curC().mode!==mode||i===0) state.current=last; renderList(); }
      catch(e){ pending.push(files[i]); }
      continue;
    }
    setStatus('자료 읽는 중… ('+(i+1)+'/'+files.length+') '+files[i].name);
    var c;
    try{ c=await g.parse(files[i]); c.mode=mode;
      if((mode==='adult'||mode==='child')&&c.kind&&c.kind!==mode) c.warns.unshift(c.kind==='child'?'아동·청소년용 결과지로 보입니다. "자녀 지문성향" 탭에서 올리는 것을 권합니다. (내용은 자녀용 양식으로 만들었습니다)':'성인용 결과지로 보입니다. "성인 지문성향" 탭에서 올리는 것을 권합니다. (내용은 성인용 양식으로 만들었습니다)');
    }catch(e){ console.error(e); c={mode:mode,fileName:files[i].name,error:g.err,warns:[]}; }
    state.customers.push(c); last=state.customers.length-1;
    if(i===0) state.current=last;
    renderList();
  }
  // 질병예측 탭: 검사자료가 아닌 PDF는 보장분석으로 보고 같은 고객에게 연결
  for(var j=0;j<pending.length;j++){
    var f=pending[j], cov=null;
    try{ cov=await parseCoverage(f); }catch(e){ cov=null; }
    if(!cov||!cov.rows.length){ state.customers.push({mode:mode,fileName:f.name,error:GEN.disease.err+' (보장분석 PDF라면 검사자료와 함께 올려 주세요)',warns:[]}); continue; }
    var ds=state.customers.filter(function(x){return x.mode==='disease'&&!x.error;});
    var tgt=ds.filter(function(x){return !x.cov&&dcNameMatch(x.name,cov.name);})[0]||ds.filter(function(x){return dcNameMatch(x.name,cov.name);})[0]||ds.filter(function(x){return !x.cov;}).slice(-1)[0]||(curC()&&curC().mode==='disease'&&!curC().error?curC():null);
    if(!tgt){ state.customers.push({mode:mode,fileName:f.name,name:cov.name,waitCov:true,cov:cov,error:'보장분석 자료를 받았습니다. 같은 고객의 질병예측 검사자료를 올리면 자동으로 연결되어 통합 리포트가 만들어집니다.',warns:[]}); continue; }
    setStatus('보장분석 연결 중… '+f.name);
    await attachCoverage(tgt,f); state.current=state.customers.indexOf(tgt);
  }
  // 먼저 올려 둔 보장분석(연결 대기)을 나중에 올린 검사자료와 연결 — 올리는 순서와 상관없이
  var waits=state.customers.filter(function(x){return x.waitCov;});
  waits.forEach(function(w){
    var ds=state.customers.filter(function(x){return x.mode==='disease'&&!x.error&&!x.cov;});
    var tgt=ds.filter(function(x){return dcNameMatch(x.name,w.name);})[0]||(waits.length===1&&ds.length===1?ds[0]:null);
    if(!tgt) return;
    linkCov(tgt,w.cov,w.fileName);
    state.customers.splice(state.customers.indexOf(w),1);
    state.current=state.customers.indexOf(tgt);
  });
  if(state.current>=state.customers.length) state.current=state.customers.length-1;
  setStatus('');
  select(state.current);
}
/* 목록에서 삭제 · 다른 PDF로 교체 */
var repIdx=-1;
function removeAt(i){
  if(i<0||i>=state.customers.length) return;
  var m=state.customers[i].mode; state.customers.splice(i,1);
  if(state.current===i){ state.current=-1; state.customers.forEach(function(c,k){ if(c.mode===m&&state.current<0) state.current=k; }); }
  else if(state.current>i) state.current--;
  renderList(); renderEdit(); renderCurrent(); fitPreview();
}
async function replaceAt(i,file){
  var old=state.customers[i]; if(!old) return;
  var before=state.customers.length;
  await addFiles([file]);
  var added=state.customers.slice(before).filter(function(x){return !x.waitCov;});
  if(!added.length) return;
  var n=added[0];
  if(old.cov&&n.mode==='disease'&&!n.cov&&!n.error) linkCov(n,old.cov,old.covFile);
  var oi=state.customers.indexOf(old); state.customers.splice(oi,1);
  var ni=state.customers.indexOf(n); state.customers.splice(ni,1); state.customers.splice(oi,0,n);
  select(oi);
}
$('rfile').onchange=function(){ var f=this.files[0]; this.value=''; if(f&&repIdx>=0) replaceAt(repIdx,f); repIdx=-1; };
var drop=$('drop');
$('file').onchange=function(){ addFiles(this.files); this.value=''; };
['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over');}); });
['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over');}); });
drop.addEventListener('drop',function(e){ addFiles(e.dataTransfer.files); });
$('manualBtn').onclick=function(){ state.customers.push(newCoverageManual()); select(state.customers.length-1); };

/* ---------- PDF 저장 ---------- */
function fileName(c){
  var a=adv(); var clean=function(s){return String(s||'').replace(/[\\\/:*?"<>|\s]+/g,'');};
  var kind=(c.mode==='coverage'&&isKid(c))?'자녀보험보장분석리포트':MODES[c.mode].file;
  return clean(c.name||'고객')+'_'+kind+'_'+clean(a.name||'설계사')+'.pdf';
}
/* ---------- 모바일: 미리보기를 화면 폭에 맞춤 · 데스크톱 모드 보정 · 하단 저장 버튼 ---------- */
function fitPreview(){
  var host=$('pages'), wrap=host.parentNode; if(!host) return;
  host.style.zoom='';
  var w=wrap.clientWidth||window.innerWidth; var z=Math.min(1,(w-2)/794);
  host.style.zoom=z<1?String(z):'';
  var hasC=!!(curC()&&!curC().error);
  document.body.classList.toggle('hasmbar',hasC);
  $('mbar').style.visibility=hasC?'visible':'hidden';
}
(function(){
  try{
    var coarse=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
    var vw=document.documentElement.clientWidth, sw=Math.min(screen.width,screen.height);
    if(coarse&&sw&&vw>sw*1.3){ document.documentElement.style.zoom=String(vw/sw); }
  }catch(e){}
})();
window.addEventListener('resize',function(){ clearTimeout(window.__fpT); window.__fpT=setTimeout(fitPreview,150); });
$('mSave').onclick=function(){ $('saveOne').click(); };
$('mPreview').onclick=function(){ var p=$('pages'); if(p) p.scrollIntoView({behavior:'smooth'}); };
async function savePdf(c){
  var hostZ=$('pages').style.zoom, docZ=document.documentElement.style.zoom; $('pages').style.zoom=''; document.documentElement.style.zoom='';
  try{ return await savePdfInner(c); } finally { document.documentElement.style.zoom=docZ; $('pages').style.zoom=hostZ; fitPreview(); }
}
async function savePdfInner(c){
  if(document.fonts&&document.fonts.ready) await document.fonts.ready;
  var pages=$('pages').querySelectorAll('.page');
  var pdf=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
  for(var i=0;i<pages.length;i++){
    setStatus('PDF 만드는 중… '+(i+1)+'/'+pages.length+'쪽');
    var cv=await html2canvas(pages[i],{scale:2,backgroundColor:'#FBF8F4',useCORS:true,logging:false,width:794,height:1123,windowWidth:1400});
    if(i>0) pdf.addPage('a4','portrait');
    // A4 용지 안쪽에 여백(좌우 9mm)을 두고 배치 — PC 화면·인쇄 모두 답답하지 않게
    var mw=192, mh=mw*297/210, mx=(210-mw)/2, my=(297-mh)/2;
    pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',mx,my,mw,mh,undefined,'FAST');
    pdf.setDrawColor(225,220,212); pdf.setLineWidth(0.2); pdf.rect(mx,my,mw,mh);
  }
  var blob=pdf.output('blob');
  if(window.parent&&window.parent!==window&&window.parent.BOIT_SAVE){ var r=await window.parent.BOIT_SAVE(blob,fileName(c)); if(r!=='ok') throw new Error(r||'save'); }
  else pdf.save(fileName(c));
}
function needAdv(){
  if(!adv().name){ alert('먼저 왼쪽 "내 정보"에 설계사 이름을 입력해 주세요.'); $('advName').focus(); return true; }
  return false;
}
$('saveOne').onclick=async function(){
  if(needAdv()) return;
  var c=curC(); if(!c||c.error) return;
  state.busy=true; renderList();
  try{ await savePdf(c); setStatus('저장했습니다: '+fileName(c)); }catch(e){ console.error(e); setStatus('PDF 저장 중 문제가 생겼습니다. 다시 시도해 주세요.'); }
  state.busy=false; renderList();
};
$('saveAll').onclick=async function(){
  if(needAdv()) return;
  state.busy=true; renderList();
  var keep=state.current, n=0;
  for(var i=0;i<state.customers.length;i++){
    var c=state.customers[i];
    if(c.error||c.mode!==state.mode) continue;
    select(i); state.busy=true; renderList();
    try{ await savePdf(c); n++; }catch(e){ console.error(e); }
    await new Promise(function(r){setTimeout(r,400);});
  }
  state.busy=false; select(keep);
  setStatus(n+'명의 리포트를 저장했습니다.');
};
setMode('coverage');
window.__fpApp={state:state,setMode:setMode,addFiles:addFiles,dcChecks:dcChecks,dcProposals:dcProposals};
})();
</script>
