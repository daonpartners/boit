<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보험설계사 개인페이지</title>
<meta name="robots" content="noindex">
<!-- 카톡·문자로 링크 보낼 때 미리보기 (2026-11-22) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="보잇 BOIT">
<meta property="og:title" content="보험설계사 개인페이지 · 보험 상담 신청">
<meta property="og:description" content="보험 상담 · 보험금 청구 안내 · 상담 신청을 한곳에서">
<meta property="og:image" content="https://boit.ai.kr/assets/app/og-page.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
html,body{margin:0;background:#E9EDEB}
body{font-family:var(--f-ui)}
*{box-sizing:border-box}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#F6F7F6}
/* 카톡으로 받은 카드: 맨 위에 카드 전체를 보여줌 */
.kcard{max-width:520px;margin:0 auto;padding:16px 16px 4px}.kcard img{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.msg{padding:60px 20px;text-align:center;color:#4A5753;font-size:14px}
.hpv{font-family:var(--f-ui);color:#18221F;background:#F6F7F6;font-size:14px}
.hpv .ban{height:120px;background:linear-gradient(135deg,var(--hpc,#0E7A5F),#0B4F40)}
.hpv .pf{padding:0 16px 14px;margin-top:-44px;display:flex;flex-direction:column;gap:6px}
.hpv .ph{width:88px;height:88px;border-radius:50%;border:4px solid #fff;object-fit:cover;background:#DDE3DF}
.hpv .org{display:inline-block;align-self:flex-start;font-size:11.5px;padding:2px 8px;border-radius:99px;background:#E2F1EB;color:#0E7A5F;font-weight:600}
.hpv h3{margin:0;font-size:20px;line-height:1.35}.hpv h3 em{font-style:normal;color:var(--hpc,#0E7A5F)}
.hpv .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px}
.hpv .acts a{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1px solid #E1E6E3;border-radius:10px;padding:9px 2px;font-size:11.5px;color:#18221F;text-decoration:none;font-weight:600}
.hpv .acts a span{font-size:18px;line-height:1}
.hpv .blk{background:#fff;margin:10px 12px 0;border-radius:12px;padding:12px 14px;border:1px solid #E7EBE9}
.hpv .blk h4{margin:0 0 6px;font-size:14px}
.hpv .blk p{margin:0;font-size:13px;color:#4A5753;line-height:1.6}
.hpv .tags{display:flex;flex-wrap:wrap;gap:5px}.hpv .tags span{font-size:12px;background:#F0F3F1;border-radius:99px;padding:2px 9px}
.hpv .cta{display:block;text-align:center;margin-top:8px;background:var(--hpc,#0E7A5F);color:#fff;border-radius:9px;padding:10px;font-weight:700;text-decoration:none;font-size:13.5px}
.hpv .nw{font-size:12.5px;line-height:1.5;padding:5px 0;border-bottom:1px solid #EEF1EF}.hpv .nw a{color:#18221F;text-decoration:none}
.hpv .ev .ei{display:block;width:100%;border-radius:8px;margin:6px 0}.hpv .ev{margin:12px 14px;border:2px solid var(--hpc,#0E7A5F);border-radius:14px;padding:14px 14px 12px;background:#fff}
.hpv .ev .lb{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--hpc,#0E7A5F);border-radius:99px;padding:2px 9px}
.hpv .ev h4{margin:8px 0 4px;font-size:17px}.hpv .ev .sb{margin:0 0 8px;font-size:13.5px;color:#4A5753}
.hpv .ev p{font-size:13px;line-height:1.65;margin:0 0 6px;color:#2A3532}.hpv .ev .gf{font-size:12.5px;background:#F0F3F1;border-radius:8px;padding:7px 9px;margin:6px 0}
.hpv .ev .dt{font-size:12px;color:#7A8682}.hpv .ev .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hpv .ev .two .cta{margin-top:8px}
.hpv .ev.end{border-color:#C9D0CD;opacity:.75}
.hpv .ft{padding:14px 16px 18px;font-size:11px;color:#7A8682;line-height:1.6}
.evf{display:flex;flex-direction:column;gap:8px;margin-top:10px}.evf input[name]{height:46px;border:1.5px solid #D9DEE3;border-radius:10px;padding:0 12px;font:inherit;font-size:16px}
.evag{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#4A5753;line-height:1.5}.evag input{width:20px;height:20px;flex:none;margin:1px 0 0}.everr{margin:0;color:#C4472F;font-size:13px;font-weight:700}
.evsms{font-size:12.5px;color:#6B7672;text-align:center}.evok{margin:6px 0 0;padding:12px;border-radius:10px;background:#E2F1EB;color:#0E7A5F;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div id="app"><p class="msg">불러오는 중…</p></div>
<script src="supabase.js"></script>
<script>
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BOIT_CLOUD={url:"https://lobdowpxujgiadrtxklb.supabase.co",key:"sb_publishable_3mJ3y2GqpQWMIzwgzV7yVg_M_HCdTzW"};
function hpHTML(d,news){ const tel=String(d.phone||"").replace(/[^\d]/g,"");
  const acts=[["📞","전화",tel?`tel:${tel}`:""],["💬","문자",tel?`sms:${tel}`:""],["🟡","카카오톡",d.kakao||""],["👤","연락처 저장","#vcard"]].filter(a=>a[2]);
  const tags=String(d.tags||"").split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  const career=String(d.career||"").split("\n").map(s=>s.trim()).filter(Boolean);
  return `<div class="hpv" style="--hpc:${esc(d.color||"#0E7A5F")}"><div class="ban"></div><div class="pf">${d.photo?`<img class="ph" src="${esc(d.photo)}" alt="">`:`<div class="ph"></div>`}
    ${d.company?`<span class="org">${esc(d.company)}${d.branch?" · "+esc(d.branch):""}</span>`:""}<h3>안녕하세요.<br><em>${esc(d.name||"이름")} ${esc(d.title||"")}</em> 입니다.</h3><p style="margin:0;font-size:13px;color:#4A5753;line-height:1.6">${esc(d.greet||"")}</p></div>
    <div class="acts">${acts.map(a=>`<a href="${esc(a[2])}" ${a[2].startsWith("http")?'target="_blank" rel="noopener"':""} data-hpact="${a[1]}"><span>${a[0]}</span>${a[1]}</a>`).join("")}</div>
    ${tags.length?`<div class="blk"><h4>상담 분야</h4><div class="tags">${tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div></div>`:""}
    ${career.length?`<div class="blk"><h4>경력·자격</h4><p>${career.map(esc).join("<br>")}</p></div>`:""}
    ${d.showClaim?`<div class="blk"><h4>보험금 청구 도와드립니다</h4><p>영수증·진단서 사진을 올리고 서명하면 담당 설계사에게 바로 접수됩니다.</p><a class="cta" href="c.html?u=${encodeURIComponent(window.__SLUG||"")}">보험금 청구 접수하기</a>${tel?`<a class="evsms" style="display:block;text-align:center;margin-top:8px" href="sms:${tel}?body=${encodeURIComponent("보험금 청구 문의드립니다. 이름: ")}">문자로 문의하기</a>`:""}</div>`:""}
    ${d.showCheck?`<div class="blk"><h4>내 진료기록 직접 확인하기</h4><p>최근 5년 진료기록을 심평원에서 직접 확인하세요.</p><a class="cta" style="background:#fff;color:var(--hpc,#0E7A5F);border:1px solid currentColor" href="https://www.hira.or.kr" target="_blank" rel="noopener">심평원 홈페이지 열기</a></div>`:""}
    ${d.showNews&&news&&(news.news||[]).length?`<div class="blk"><h4>오늘의 뉴스 <span style="font-weight:400;font-size:12px;color:#7A8682">${esc(news.dateLabel||news.date||"")}</span></h4>${news.news.slice(0,5).map(n=>`<div class="nw">${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>`:esc(n.title)}</div>`).join("")}</div>`:""}
    ${d.office||d.email?`<div class="blk"><h4>연락처</h4><p>${d.office?esc(d.office)+"<br>":""}${d.email?esc(d.email):""}</p></div>`:""}
    <div class="ft">${d.reg?`보험설계사 등록번호 ${esc(d.reg)}<br>`:""}${d.company?esc(d.company)+" 소속 · ":""}보험 상품 가입 전 상품설명서와 약관을 확인하세요.<br>보잇 BOIT 개인페이지</div></div>`; }

function evHTML(d,sel,ref){ const tel=String(d.phone||"").replace(/[^\d]/g,""), now=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  let L=(d.events||[]).filter(e=>!(e.start&&now<e.start));
  const live=e=>!(e.end&&now>e.end);
  if(sel){ const x=L.find(e=>e.id===sel); L=x?[x]:L.filter(live); } else L=L.filter(live); /* 이벤트 링크·QR로 들어오면 그 이벤트 하나만 (2026-11-24) */
  return L.map(e=>{ const on=live(e), body=`[${e.title}] 참여 신청합니다.\n이름: \n연락 가능한 시간: ${ref?`\n(소개 코드 ${ref})`:""}`;
    return `<div class="ev${on?"":" end"}"><span class="lb">${on?"진행 중인 이벤트":"종료된 이벤트"}</span><h4>${esc(e.title)}</h4>${e.sub?`<p class="sb">${esc(e.sub)}</p>`:""}
    ${String(e.body||"").split("\n").filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join("")}
    ${(e.imgs||[]).filter(s=>/^data:image\/(jpeg|png);base64,/.test(s)).map(s=>`<img class="ei" src="${s}" alt="">`).join("")}
    ${e.gift?`<div class="gf">🎁 ${esc(e.gift)}</div>`:""}${e.start||e.end?`<div class="dt">기간 ${esc(e.start||"")} ~ ${esc(e.end||"")}</div>`:""}
    ${on?`<form class="evf" data-evform="${esc(e.id)}" data-cta="${esc(e.cta||"참여 신청하기")}"><input name="nm" maxlength="20" placeholder="이름" autocomplete="name"><input name="ph" type="tel" inputmode="numeric" maxlength="13" placeholder="휴대폰번호 010-0000-0000" autocomplete="tel">
      <label class="evag"><input type="checkbox" name="ag"> <span><b>[필수] 개인정보 수집·이용 동의</b><br>처리자: ${esc([d.company,d.branch].filter(Boolean).join(" "))} 담당 설계사 ${esc(d.name||"")} · 항목: 이름·휴대폰 · 목적: 이벤트 참여 신청 접수와 연락 · 보유: 이벤트 종료 후 최대 1년 · 위탁: 신청 접수 시스템 운영 다온파트너스(보잇) · 동의하지 않으면 신청할 수 없습니다</span></label>
      <button class="cta" type="submit">${esc(e.cta||"참여 신청하기")}</button><p class="everr"></p>${tel?`<a class="evsms" href="sms:${tel}?body=${encodeURIComponent(body)}">문자로 신청하기</a>`:""}</form>
    <a class="cta" style="background:#fff;color:var(--hpc,#0E7A5F);border:1px solid currentColor;margin-top:8px" href="#" data-evshare="${esc(e.id)}">친구에게 전하기</a>`:""}</div>`; }).join(""); }
function vcard(d){ const tel=String(d.phone||"").replace(/[^\d+]/g,"");
  const v=["BEGIN:VCARD","VERSION:3.0",`FN:${d.name||""}`,`N:${d.name||""};;;;`,d.company?`ORG:${d.company}${d.branch?";"+d.branch:""}`:"",d.title?`TITLE:${d.title}`:"",tel?`TEL;TYPE=CELL:${tel}`:"",d.email?`EMAIL:${d.email}`:"",d.office?`ADR;TYPE=WORK:;;${d.office};;;;`:"",`URL:${location.href}`,"END:VCARD"].filter(Boolean).join("\r\n");
  return new Blob([v],{type:"text/vcard;charset=utf-8"}); }
(async function(){
  const Q=new URLSearchParams(location.search), app=document.getElementById("app"), u=(Q.get("u")||"").toLowerCase();
  const c=(Q.get("c")||"").replace(/^http:/,"https:"), card=/^https:\/\/k\.kakaocdn\.net\/dn\/[\w./-]+$/.test(c)?`<div class="kcard"><img src="${c}" alt="받은 카드"></div>`:"";
  window.__SLUG=u;
  if(!/^[a-z0-9][a-z0-9-]{3,29}$/.test(u)){ app.innerHTML=card||'<p class="msg">주소가 올바르지 않습니다.</p>'; return; }
  let d=null, news=null;
  try{ const sb=supabase.createClient(BOIT_CLOUD.url,BOIT_CLOUD.key,{auth:{persistSession:false}});
    const r=await sb.from("boit_pages").select("data").eq("slug",u).maybeSingle(); if(r.error) throw r.error; d=r.data&&r.data.data; }catch(e){}
  if(!d){ app.innerHTML=card||'<p class="msg">페이지를 찾을 수 없습니다.</p>'; return; }
  if(d.showNews){ for(const u of ["morning.json"]){ try{ const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"}); if(!r.ok) continue; const j=await r.json(); if(!news||(j.date||"")>(news.date||"")) news=j; }catch(e){} } }
  document.title=`${d.name||""} ${d.title||""}`.trim()||document.title;
  const ev=(Q.get("ev")||"").slice(0,20), ref=(Q.get("r")||"").replace(/[^\w]/g,"").slice(0,12);
  app.innerHTML=card+hpHTML(d,news);
  const evh=evHTML(d,ev,ref); if(evh){ const pf=app.querySelector(".hpv .acts"); if(pf) pf.insertAdjacentHTML(ev?"beforebegin":"afterend",evh); }
  if(ev){ const t=app.querySelector(".hpv .ev"); if(t) setTimeout(()=>t.scrollIntoView({block:"start"}),50); }
  app.addEventListener("click",async e=>{ const a=e.target.closest("[data-evshare]"); if(!a) return; e.preventDefault();
    const x=(d.events||[]).find(v=>v.id===a.dataset.evshare)||{}, url=location.origin+location.pathname+"?u="+encodeURIComponent(u)+"&ev="+encodeURIComponent(x.id||"")+(ref?"&r="+ref:"");
    const text=`[${x.title||""}] ${x.sub||""}`;
    try{ if(navigator.share){ await navigator.share({title:x.title||"",text,url}); return; } }catch(_){ return; }
    try{ await navigator.clipboard.writeText(text+"\n"+url); a.textContent="링크 복사됨"; }catch(_){ prompt("링크",url); } });
  /* 이벤트 참여 신청 → 보잇 상담접수 DB (2026-11-22) */
  app.addEventListener("click",e=>{ const a=e.target.closest("[data-evap]"); if(!a) return; e.preventDefault(); const f=app.querySelector(`[data-evform="${a.dataset.evap}"]`); if(f){ f.hidden=!f.hidden; if(!f.hidden) f.nm.focus(); } });
  app.addEventListener("input",e=>{ if(e.target.name==="ph"){ const n=e.target.value.replace(/\D/g,"").slice(0,11); e.target.value=n.length>=8?n.replace(/(\d{3})(\d{3,4})(\d{4})/,"$1-$2-$3"):n; } });
  app.addEventListener("submit",async e=>{ const f=e.target.closest("[data-evform]"); if(!f) return; e.preventDefault(); const er=f.querySelector(".everr"), bt=f.querySelector("button");
    const nm=f.nm.value.trim(), ph=f.ph.value.replace(/\D/g,""); er.textContent="";
    if(nm.length<2) return er.textContent="이름을 입력해 주세요."; if(!/^01\d{8,9}$/.test(ph)) return er.textContent="휴대폰번호를 확인해 주세요."; if(!f.ag.checked) return er.textContent="개인정보 수집·이용에 동의해 주세요.";
    bt.disabled=true; bt.textContent="보내는 중…";
    try{ const r=await fetch(BOIT_CLOUD.url+"/functions/v1/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({act:"event",u,ev:f.dataset.evform,ref,name:nm,phone:ph,agree:true})}); const j=await r.json().catch(()=>({}));
      if(!j.ok) throw new Error(j.error||"잠시 후 다시 시도해 주세요.");
      f.innerHTML=`<p class="evok">신청이 접수되었습니다. ${esc(d.name||"담당")} 설계사가 곧 연락드립니다.</p>`; }
    catch(err){ bt.disabled=false; bt.textContent=f.dataset.cta||"신청 보내기"; er.textContent=err.message||"연결에 실패했습니다."; } });
  app.addEventListener("click",e=>{ const a=e.target.closest('[data-hpact="연락처 저장"]'); if(!a) return; e.preventDefault();
    const url=URL.createObjectURL(vcard(d)), x=document.createElement("a"); x.href=url; x.download=`${d.name||"연락처"}.vcf`; document.body.appendChild(x); x.click(); x.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); });
})();
</script>
</body>
</html>
